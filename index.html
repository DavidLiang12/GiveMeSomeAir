<body>
<div class="television"><div class="screen">
<header><span class="brand">Give Me Some Air</span><span class="tag">DIRECTION SYSTEM / 01</span></header>
<main>
<section class="control" aria-label="Spinner controls">
<h1><span>Your next</span><span>move.</span></h1>
<div class="result" role="status" aria-live="polite" aria-atomic="true"><p class="result-label" id="result-label">YOUR DIRECTION</p><div class="result-row"><div class="result-icon" id="result-icon" aria-hidden="true">✦</div><h2 id="result-title">Ready to move?</h2></div><p class="result-note" id="result-note">Spin to discover your next direction.</p></div>
<div class="actions"><button class="spin" id="spin">Spin the wheel</button><button class="rest" id="rest">Enter Closed-Eye Phase</button></div>
</section>
<section class="wheel-zone" aria-label="Six-direction spinner"><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><svg class="wheel" id="wheel" viewBox="0 0 520 520" role="img" aria-label="Wheel with Up, Right, Down, Rotate Right, Left, and Rotate Left"></svg><div class="hub" aria-hidden="true">SPIN</div></div></section>
</main>

</div></div>
<dialog id="rest-dialog" aria-labelledby="rest-title" aria-describedby="rest-description"><div class="rest-symbol" aria-hidden="true">Ⅱ</div><h2 id="rest-title">Enter Closed-Eye Phase</h2><p id="rest-description">Take a breath. Relax your shoulders.<br>Ready when you are.</p><button class="spin" id="resume" autofocus>Back to the wheel</button></dialog>
<script>
const directions=[{label:'Up',icon:'↑',color:'#c5272e',ink:'#fff0ac'},{label:'Right',icon:'→',color:'#121a10',ink:'#f1df79'},{label:'Down',icon:'↓',color:'#121a10',ink:'#95e885'},{label:'Rotate Right',icon:'↻',color:'#c5272e',ink:'#fff0ac'},{label:'Left',icon:'←',color:'#121a10',ink:'#f1df79'},{label:'Rotate Left',icon:'↺',color:'#121a10',ink:'#95e885'}];
const wheel=document.getElementById('wheel'),spinButton=document.getElementById('spin'),dialog=document.getElementById('rest-dialog');
const title=document.getElementById('result-title'),icon=document.getElementById('result-icon'),note=document.getElementById('result-note');
const ns='http://www.w3.org/2000/svg';
function svgElement(name,attrs,parent=wheel){const e=document.createElementNS(ns,name);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
const polar=(r,deg)=>[260+r*Math.cos(deg*Math.PI/180),260+r*Math.sin(deg*Math.PI/180)];
svgElement('circle',{cx:260,cy:260,r:251,fill:'none',stroke:'#95e885','stroke-width':2});
svgElement('circle',{cx:260,cy:260,r:245,fill:'none',stroke:'#506938','stroke-width':1});
for(let i=0;i<60;i++){const a=polar(241,i*6),b=polar(i%5?238:233,i*6);svgElement('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:i%5?'#6d7746':'#f1df79','stroke-width':1});}
directions.forEach((d,i)=>{const start=-120+i*60,end=start+60,a=polar(226,start),b=polar(226,end);svgElement('path',{d:`M260 260 L${a} A226 226 0 0 1 ${b} Z`,fill:d.color,stroke:'#dccd70','stroke-width':2});const g=svgElement('g',{transform:`rotate(${i*60} 260 260)`});svgElement('text',{x:260,y:105,'text-anchor':'middle',fill:d.ink,'font-size':43,'font-family':'Arial, sans-serif'},g).textContent=d.icon;const label=svgElement('text',{x:260,y:143,'text-anchor':'middle',fill:d.ink,'font-size':27,'font-family':'VT323, Courier New, monospace','class':'direction-label'},g);d.label.toUpperCase().split(' ').forEach((word,j)=>{svgElement('tspan',{x:260,dy:j?'1em':0},label).textContent=word;});});
function resizeWheelLabels(){const w=wheel.getBoundingClientRect().width||520;wheel.querySelectorAll('.direction-label').forEach(el=>el.setAttribute('font-size',Math.max(27,16*520/w)));}
new ResizeObserver(resizeWheelLabels).observe(wheel);

let rotation=0,spinning=false,animation=null,pendingFinish=null,resolveSpin=null;
function completeSpin(index){const d=directions[index];wheel.style.transform=`rotate(${rotation}deg)`;animation?.cancel();animation=null;spinning=false;spinButton.disabled=false;spinButton.textContent='Spin again';title.textContent=d.label;icon.textContent=d.icon;note.textContent='Your direction is set. Spin again for a new move.';const resolve=resolveSpin;resolveSpin=null;resolve?.({direction:d.label});}
function spin(){if(spinning||dialog.open)return Promise.reject(new Error('The wheel is spinning or on a rest break.'));spinning=true;spinButton.disabled=true;spinButton.textContent='Spinning…';title.textContent='Here we go…';icon.textContent='↻';note.textContent='Let the wheel choose your next move.';const values=new Uint32Array(1);let n;do{crypto.getRandomValues(values);n=values[0]}while(n>=4294967292);const index=n%6,offset=((360-index*60)-(rotation%360)+360)%360;const previous=rotation;rotation+=1800+offset;const promise=new Promise(resolve=>{resolveSpin=resolve});const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?150:3900;animation=wheel.animate([{transform:`rotate(${previous}deg)`},{transform:`rotate(${rotation}deg)`}],{duration,easing:'cubic-bezier(.13,.65,.12,1)',fill:'forwards'});animation.onfinish=()=>{if(dialog.open)pendingFinish=index;else completeSpin(index)};return promise;}
function startRest(){if(dialog.open)return {resting:true};animation?.pause();document.body.classList.add('is-resting');dialog.showModal();return {resting:true};}
function endRest(){if(dialog.open)dialog.close();return {resting:false};}
spinButton.addEventListener('click',()=>spin().catch(()=>{}));document.getElementById('rest').addEventListener('click',startRest);document.getElementById('resume').addEventListener('click',endRest);dialog.addEventListener('close',()=>{document.body.classList.remove('is-resting');if(pendingFinish!==null){const index=pendingFinish;pendingFinish=null;completeSpin(index)}else animation?.play();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!dialog.open&&!e.target.closest('button, input, textarea, select, a, [contenteditable]')){e.preventDefault();if(!spinning)spin().catch(()=>{});}});
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const register=(name,description,execute)=>{try{Promise.resolve(document.modelContext.registerTool({name,description,inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('Expected an empty object.');return execute();}},{signal:lifecycle.signal})).catch(()=>{});}catch{}};register('spin_direction_wheel','Spin the wheel and return the selected direction after it stops.',spin);register('start_rest_break','Pause the spinner and open Enter Closed-Eye Phase.',startRest);register('end_rest_break','Close Enter Closed-Eye Phase and resume a paused spin.',endRest);window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script>
</body></html>
